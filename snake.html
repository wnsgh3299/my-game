<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SNAKE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #070c18;
    color: white;
    font-family: Arial, "Noto Sans KR", sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}

.container {
    width: 100%;
    max-width: 650px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
}

.description {
    color: #91a7c5;
    margin-bottom: 20px;
}

/* 점수 */

.score-box {
    display: flex;
    justify-content: center;
    gap: 35px;

    margin-bottom: 20px;

    font-size: 17px;
}

.score-box span {
    color: #60a5fa;
    font-weight: bold;
}


/* 게임판 */

.game-board {
    width: min(90vw, 500px);
    height: min(90vw, 500px);

    margin: 0 auto;

    background: #0d1628;

    border: 3px solid #263653;

    display: grid;

    grid-template-columns: repeat(20, 1fr);
    grid-template-rows: repeat(20, 1fr);

    position: relative;

    overflow: hidden;
}


/* 뱀 */

.snake {
    background: #22c55e;

    border-radius: 4px;

    margin: 1px;
}


/* 뱀 머리 */

.head {
    background: #4ade80;
}


/* 먹이 */

.food {
    background: #ef4444;

    border-radius: 50%;

    margin: 3px;
}


/* 게임 오버 */

.game-over {
    position: absolute;

    inset: 0;

    background: rgba(0, 0, 0, 0.75);

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 10;
}

.game-over h2 {
    font-size: 38px;
    margin-bottom: 10px;
}

.game-over p {
    color: #b5c4da;
    margin-bottom: 20px;
}


/* 버튼 */

button {
    border: none;

    border-radius: 10px;

    padding: 13px 27px;

    margin: 6px;

    color: white;

    background: #2563eb;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #3b82f6;
    transform: translateY(-2px);
}


/* 시작 */

#startButton {
    margin-top: 20px;
}


/* 방향키 */

.controls {
    margin-top: 20px;

    display: grid;

    grid-template-columns: repeat(3, 65px);

    justify-content: center;

    gap: 5px;
}

.controls button {
    width: 65px;
    height: 55px;

    padding: 0;

    margin: 0;

    background: #1e293b;

    border: 1px solid #334155;

    font-size: 22px;
}

.controls button:hover {
    background: #334155;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}


/* 메인으로 */

.home {
    margin-top: 25px;

    background: #1e293b;

    border: 1px solid #334155;
}

.home:hover {
    background: #334155;
}


/* 모바일 */

@media (max-width: 500px) {

    h1 {
        font-size: 34px;
    }

    .description {
        font-size: 14px;
    }

    .score-box {
        font-size: 15px;
    }

    .controls {
        grid-template-columns: repeat(3, 60px);
    }

    .controls button {
        width: 60px;
        height: 50px;
    }

}

</style>
</head>


<body>


<div class="container">

    <h1>🐍 SNAKE</h1>

    <p class="description">
        먹이를 먹고 최대한 길게 성장하세요!
    </p>


    <!-- 점수 -->

    <div class="score-box">

        <div>
            SCORE :
            <span id="score">0</span>
        </div>

        <div>
            BEST :
            <span id="best">0</span>
        </div>

    </div>


    <!-- 게임판 -->

    <div
        class="game-board"
        id="board">


        <!-- 게임 오버 -->

        <div
            class="game-over"
            id="gameOver">

            <h2>GAME OVER</h2>

            <p>
                최종 점수 :
                <span id="finalScore">0</span>
            </p>

            <button onclick="restartGame()">
                🔄 다시하기
            </button>

        </div>

    </div>


    <!-- 시작 -->

    <button
        id="startButton"
        onclick="startGame()">

        게임 시작

    </button>


    <!-- 방향키 -->

    <div class="controls">

        <button
            class="up"
            onclick="changeDirection('up')">

            ▲

        </button>

        <button
            class="left"
            onclick="changeDirection('left')">

            ◀

        </button>

        <button
            class="down"
            onclick="changeDirection('down')">

            ▼

        </button>

        <button
            class="right"
            onclick="changeDirection('right')">

            ▶

        </button>

    </div>


    <!-- 메인 -->

    <button
        class="home"
        onclick="location.href='index.html'">

        🏠 메인으로

    </button>

</div>



<script>

/* =========================
   기본 설정
========================= */

const SIZE = 20;

let snake = [];

let food = {};

let direction = "right";

let nextDirection = "right";

let gameRunning = false;

let gameLoop = null;

let score = 0;

let bestScore =
    Number(localStorage.getItem("snakeBest")) || 0;


/* 최고 점수 표시 */

document.getElementById("best").textContent =
    bestScore;


/* =========================
   게임판 만들기
========================= */

function drawBoard() {

    const board =
        document.getElementById("board");

    /* 기존 칸 제거 */

    document
        .querySelectorAll(".cell")
        .forEach(cell => cell.remove());


    /* 20 × 20 칸 */

    for (let y = 0; y < SIZE; y++) {

        for (let x = 0; x < SIZE; x++) {

            const cell =
                document.createElement("div");

            cell.classList.add("cell");

            cell.dataset.x = x;
            cell.dataset.y = y;

            board.insertBefore(
                cell,
                document.getElementById("gameOver")
            );

        }

    }

}


/* =========================
   화면 그리기
========================= */

function render() {

    document
        .querySelectorAll(".cell")
        .forEach(cell => {

            cell.className = "cell";

        });


    /* 뱀 */

    snake.forEach((part, index) => {

        const cell =
            document.querySelector(
                `.cell[data-x="${part.x}"][data-y="${part.y}"]`
            );

        if (!cell) return;

        cell.classList.add("snake");

        if (index === 0) {

            cell.classList.add("head");

        }

    });


    /* 먹이 */

    const foodCell =
        document.querySelector(
            `.cell[data-x="${food.x}"][data-y="${food.y}"]`
        );

    if (foodCell) {

        foodCell.classList.add("food");

    }

}


/* =========================
   먹이 생성
========================= */

function createFood() {

    do {

        food = {

            x:
                Math.floor(
                    Math.random() * SIZE
                ),

            y:
                Math.floor(
                    Math.random() * SIZE
                )

        };

    } while (

        snake.some(
            part =>
                part.x === food.x &&
                part.y === food.y
        )

    );

}


/* =========================
   게임 시작
========================= */

function startGame() {

    if (gameRunning) {
        return;
    }

    snake = [

        { x: 10, y: 10 },

        { x: 9, y: 10 },

        { x: 8, y: 10 }

    ];


    direction = "right";

    nextDirection = "right";

    score = 0;


    document.getElementById("score")
        .textContent = score;


    document.getElementById("gameOver")
        .style.display = "none";


    document.getElementById("startButton")
        .style.display = "none";


    createFood();

    render();


    gameRunning = true;


    gameLoop =
        setInterval(moveSnake, 130);

}


/* =========================
   뱀 이동
========================= */

function moveSnake() {

    direction = nextDirection;


    const head = {
        x: snake[0].x,
        y: snake[0].y
    };


    if (direction === "up") {

        head.y--;

    }

    if (direction === "down") {

        head.y++;

    }

    if (direction === "left") {

        head.x--;

    }

    if (direction === "right") {

        head.x++;

    }


    /* 벽 충돌 */

    if (

        head.x < 0 ||
        head.x >= SIZE ||
        head.y < 0 ||
        head.y >= SIZE

    ) {

        endGame();

        return;

    }


    /* 자기 몸 충돌 */

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* 먹이를 먹었는지 */

    if (

        head.x === food.x &&
        head.y === food.y

    ) {

        score++;

        document.getElementById("score")
            .textContent = score;


        createFood();

    } else {

        snake.pop();

    }


    render();

}


/* =========================
   방향 변경
========================= */

function changeDirection(newDirection) {

    if (!gameRunning) {
        return;
    }


    /* 반대 방향 금지 */

    if (
        newDirection === "up" &&
        direction !== "down"
    ) {

        nextDirection = "up";

    }


    if (
        newDirection === "down" &&
        direction !== "up"
    ) {

        nextDirection = "down";

    }


    if (
        newDirection === "left" &&
        direction !== "right"
    ) {

        nextDirection = "left";

    }


    if (
        newDirection === "right" &&
        direction !== "left"
    ) {

        nextDirection = "right";

    }

}


/* =========================
   게임 오버
========================= */

function endGame() {

    gameRunning = false;

    clearInterval(gameLoop);


    document.getElementById("finalScore")
        .textContent = score;


    /* 최고 기록 */

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "snakeBest",
            bestScore
        );

        document.getElementById("best")
            .textContent = bestScore;

    }


    document.getElementById("gameOver")
        .style.display = "flex";

}


/* =========================
   다시하기
========================= */

function restartGame() {

    gameRunning = false;

    clearInterval(gameLoop);

    startGame();

}


/* =========================
   키보드 조작
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            changeDirection("up");

        }

        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            changeDirection("down");

        }

        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            changeDirection("left");

        }

        if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            changeDirection("right");

        }

    }
);


/* 게임판 생성 */

drawBoard();

</script>

</body>
</html>
