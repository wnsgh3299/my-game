<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAME STUDIO</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #070c18;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* 전체 */

        .container {
            width: 90%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 110px 0 80px;
        }

        /* 제목 */

        .games-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* 게임 카드 */

        .games {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .game-card {
            background: #111a2b;
            border: 1px solid #263653;
            border-radius: 17px;
            padding: 40px 30px 30px;

            min-height: 305px;

            transition: 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
        }

        /* 아이콘 */

        .game-icon {
            font-size: 55px;
            margin-bottom: 25px;
        }

        /* 게임 이름 */

        .game-card h3 {
            font-size: 25px;
            margin-bottom: 25px;
        }

        /* 설명 */

        .game-card p {
            color: #91a7c5;
            font-size: 16px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* 버튼 */

        .play-button {
            border: none;
            border-radius: 8px;

            padding: 11px 26px;

            background: #2563eb;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .play-button:hover {
            background: #3b82f6;
        }

        /* 준비중 버튼 */

        .coming-button {
            background: #3b465a;
            cursor: default;
        }

        .coming-button:hover {
            background: #3b465a;
        }

        /* 모바일 */

        @media (max-width: 1000px) {

            .games {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .container {
                padding-top: 60px;
            }

            .games-title {
                font-size: 28px;
            }

            .games {
                grid-template-columns: 1fr;
            }

            .game-card {
                min-height: 280px;
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <!-- 게임 제목 -->

        <h2 class="games-title">
            🎮 GAMES
        </h2>


        <!-- 게임 목록 -->

        <div class="games">


            <!-- COIN FLIP -->

            <div class="game-card">

                <div class="game-icon">
                    🪙
                </div>

                <h3>
                    COIN FLIP
                </h3>

                <p>
                    회전하는 동전을 보고 앞면인지 뒷면인지 맞혀보세요.
                </p>

                <button
                    class="play-button"
                    onclick="location.href='game.html'">

                    PLAY GAME

                </button>

            </div>



            <!-- MINESWEEPER -->

            <div class="game-card">

                <div class="game-icon">
                    💣
                </div>

                <h3>
                    MINESWEEPER
                </h3>

                <p>
                    지뢰를 피해 모든 칸을 열어보세요!
                    다양한 크기의 게임판을 선택할 수 있습니다.
                </p>

                <button
                    class="play-button"
                    onclick="location.href='minesweeper.html'">

                    PLAY GAME

                </button>

            </div>



            <!-- SPACE RUN -->

            <div class="game-card">

                <div class="game-icon">
                    🚀
                </div>

                <h3>
                    SPACE RUN
                </h3>

                <p>
                    새로운 게임을 준비하고 있습니다.
                </p>

                <button
                    class="play-button coming-button">

                    COMING SOON

                </button>

            </div>



            <!-- BATTLE -->

            <div class="game-card">

                <div class="game-icon">
                    ⚔️
                </div>

                <h3>
                    BATTLE
                </h3>

                <p>
                    새로운 게임을 준비하고 있습니다.
                </p>

                <button
                    class="play-button coming-button">

                    COMING SOON

                </button>

            </div>


        </div>

    </div>


</body>
</html>
