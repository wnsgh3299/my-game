<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME STUDIO</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
    min-height: 100vh;
}

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 50px;
    border-bottom: 1px solid #222;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
}

.menu {
    color: #aaa;
    font-size: 14px;
}

.hero {
    text-align: center;
    padding: 70px 20px 55px;
    border-bottom: 1px solid #222;
}

.hero-icon {
    font-size: 60px;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    color: #999;
    font-size: 17px;
    margin-bottom: 30px;
}

.start-button {
    display: none;
    border: none;
    background: white;
    color: black;
    padding: 14px 32px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.start-button:hover {
    background: #ddd;
}

.games-section {
    max-width: 1100px;
    margin: auto;
    padding: 50px 25px 80px;
}

.games-title {
    font-size: 25px;
    margin-bottom: 25px;
}

.games {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.game-card {
    background: #141419;
    border: 1px solid #29292f;
    border-radius: 14px;
    padding: 28px;
    min-height: 220px;
    transition: 0.2s;
}

.game-card:hover {
    transform: translateY(-5px);
    border-color: #555;
}

.game-icon {
    font-size: 42px;
    margin-bottom: 20px;
}

.game-card h2 {
    font-size: 20px;
    margin-bottom: 10px;
}

.game-card p {
    color: #888;
    font-size: 14px;
    line-height: 1.5;
    min-height: 42px;
}

.game-button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid #444;
    background: transparent;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.game-button:hover {
    background: white;
    color: black;
}

.coming {
    color: #666;
    cursor: default;
}

.coming:hover {
    background: transparent;
    color: #666;
}

.selected {
    border-color: white;
}

footer {
    text-align: center;
    color: #555;
    padding: 30px;
    border-top: 1px solid #222;
    font-size: 13px;
}

@media (max-width: 900px) {
    .games {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {

    header {
        padding: 0 20px;
    }

    .hero {
        padding: 55px 20px 45px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .games {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">GAME STUDIO</div>
    <div class="menu">GAMES</div>
</header>

<section class="hero">

    <div class="hero-icon" id="heroIcon">🎮</div>

    <h1 id="heroTitle">게임을 선택하세요</h1>

    <p id="heroDescription">
        아래에서 플레이할 게임을 선택해주세요.
    </p>

    <button
        class="start-button"
        id="startButton"
        onclick="startGame()">
        GAME START
    </button>

</section>


<section class="games-section">

    <div class="games-title">
        🎮 GAMES
    </div>

    <div class="games">

        <!-- 1. COIN FLIP -->
        <div class="game-card" id="coinCard">

            <div class="game-icon">🪙</div>

            <h2>COIN FLIP</h2>

            <p>
                동전을 던지고 결과를 맞혀보세요.
            </p>

            <button
                class="game-button"
                onclick="selectGame('coin')">
                SELECT
            </button>

        </div>


        <!-- 2. MINESWEEPER -->
        <div class="game-card" id="mineCard">

            <div class="game-icon">💣</div>

            <h2>MINESWEEPER</h2>

            <p>
                지뢰를 피하면서 모든 칸을 찾아보세요.
            </p>

            <button
                class="game-button"
                onclick="selectGame('mine')">
                SELECT
            </button>

        </div>


        <!-- 3. SNAKE -->
        <div class="game-card" id="snakeCard">

            <div class="game-icon">🐍</div>

            <h2>SNAKE</h2>

            <p>
                뱀을 움직여 먹이를 먹고 최고 점수에 도전하세요.
            </p>

            <button
                class="game-button"
                onclick="selectGame('snake')">
                SELECT
            </button>

        </div>


        <!-- 4. SPACE RUN -->
        <div class="game-card">

            <div class="game-icon">🚀</div>

            <h2>SPACE RUN</h2>

            <p>
                우주를 달리며 장애물을 피하는 게임.
            </p>

            <button class="game-button coming">
                COMING SOON
            </button>

        </div>


        <!-- 5. PUZZLE -->
        <div class="game-card">

            <div class="game-icon">🧩</div>

            <h2>PUZZLE</h2>

            <p>
                다양한 퍼즐을 풀어보세요.
            </p>

            <button class="game-button coming">
                COMING SOON
            </button>

        </div>


        <!-- 6. RACING -->
        <div class="game-card">

            <div class="game-icon">🏎️</div>

            <h2>RACING</h2>

            <p>
                빠르게 달려 최고의 기록을 만들어보세요.
            </p>

            <button class="game-button coming">
                COMING SOON
            </button>

        </div>

    </div>

</section>


<footer>
    GAME STUDIO © 2026
</footer>


<script>

let selectedGame = "";


function selectGame(game) {

    selectedGame = game;

    const heroIcon = document.getElementById("heroIcon");
    const heroTitle = document.getElementById("heroTitle");
    const heroDescription = document.getElementById("heroDescription");
    const startButton = document.getElementById("startButton");

    document.getElementById("coinCard").classList.remove("selected");
    document.getElementById("mineCard").classList.remove("selected");
    document.getElementById("snakeCard").classList.remove("selected");


    if (game === "coin") {

        heroIcon.innerText = "🪙";

        heroTitle.innerText = "COIN FLIP";

        heroDescription.innerText =
            "동전을 던지고 결과를 맞혀보세요.";

        document.getElementById("coinCard")
            .classList.add("selected");

    }


    if (game === "mine") {

        heroIcon.innerText = "💣";

        heroTitle.innerText = "MINESWEEPER";

        heroDescription.innerText =
            "지뢰를 피해 모든 칸을 찾아보세요.";

        document.getElementById("mineCard")
            .classList.add("selected");

    }


    if (game === "snake") {

        heroIcon.innerText = "🐍";

        heroTitle.innerText = "SNAKE";

        heroDescription.innerText =
            "먹이를 먹으며 최고 점수에 도전하세요.";

        document.getElementById("snakeCard")
            .classList.add("selected");

    }


    startButton.style.display = "inline-block";

}


function startGame() {

    if (selectedGame === "coin") {

        window.location.href = "game.html";

    }

    else if (selectedGame === "mine") {

        window.location.href = "minesweeper.html";

    }

    else if (selectedGame === "snake") {

        window.location.href = "snake.html";

    }

}

</script>

</body>
</html>
