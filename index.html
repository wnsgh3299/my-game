<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME STUDIO</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #070c18;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 90%;
    max-width: 1400px;
    margin: auto;
    padding: 50px 0 80px;
}


/* =========================
   메인 게임
========================= */

.hero {
    min-height: 500px;

    background: linear-gradient(
        135deg,
        #101a2d,
        #172746
    );

    border: 1px solid #263653;
    border-radius: 25px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 50px 20px;
    margin-bottom: 70px;
}

.hero-icon {
    font-size: 100px;
    margin-bottom: 25px;

    animation: float 3s ease-in-out infinite;
}

@keyframes float {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }

}

.hero h1 {
    font-size: 52px;
    margin-bottom: 15px;
}

.hero p {
    color: #9db1d0;
    font-size: 18px;
    margin-bottom: 35px;
}


/* 시작 버튼 */

.start-button {
    border: none;

    background: #2563eb;
    color: white;

    font-size: 17px;
    font-weight: bold;

    padding: 15px 40px;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.2s;
}

.start-button:hover {
    background: #3b82f6;
    transform: translateY(-3px);
}


/* =========================
   GAMES
========================= */

.games-title {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 30px;
}


/* 3개씩 배치 */

.games {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 24px;
}


/* =========================
   게임 카드
========================= */

.game-card {
    background: #111a2b;

    border: 1px solid #263653;

    border-radius: 18px;

    padding: 32px 28px;

    min-height: 290px;

    transition: 0.2s;

    text-align: center;
}

.game-card:hover {
    transform: translateY(-6px);

    border-color: #3b82f6;
}


/* 아이콘 */

.game-icon {
    font-size: 55px;
    margin-bottom: 20px;
}


/* 이름 */

.game-card h3 {
    font-size: 23px;
    margin-bottom: 15px;
}


/* 설명 */

.game-card p {
    color: #91a7c5;

    font-size: 15px;

    line-height: 1.5;

    min-height: 48px;

    margin-bottom: 25px;
}


/* 버튼 */

.play-button {
    border: none;

    background: #2563eb;

    color: white;

    padding: 11px 28px;

    border-radius: 8px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.play-button:hover {
    background: #3b82f6;
}


/* 선택된 게임 */

.selected {
    border-color: #3b82f6;

    box-shadow:
        0 0 25px rgba(37, 99, 235, 0.15);
}


/* 준비중 */

.coming {
    background: #3b465a;
    cursor: default;
}

.coming:hover {
    background: #3b465a;
}


/* =========================
   모바일
========================= */

@media (max-width: 900px) {

    .games {
        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media (max-width: 600px) {

    .container {
        width: 94%;
        padding-top: 25px;
    }

    .hero {
        min-height: 430px;
        margin-bottom: 50px;
    }

    .hero-icon {
        font-size: 80px;
    }

    .hero h1 {
        font-size: 38px;
    }

    .hero p {
        font-size: 15px;
    }

    .games {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<div class="container">


    <!-- =====================
         메인 화면
    ====================== -->

    <section class="hero" id="hero">

        <div
            class="hero-icon"
            id="heroIcon">

            🎮

        </div>


        <h1 id="heroTitle">

            게임을 선택하세요

        </h1>


        <p id="heroDescription">

            아래에서 플레이할 게임을 선택해주세요.

        </p>


        <button
            class="start-button"
            id="startButton"
            style="display: none;"
            onclick="startSelectedGame()">

            GAME START

        </button>

    </section>



    <!-- =====================
         게임 목록
    ====================== -->

    <h2 class="games-title">

        🎮 GAMES

    </h2>


    <div class="games">


        <!-- 1. COIN FLIP -->

        <div
            class="game-card"
            id="coinCard">

            <div class="game-icon">
                🪙
            </div>

            <h3>
                COIN FLIP
            </h3>

            <p>
                회전하는 동전을 보고
                앞면인지 뒷면인지 맞혀보세요.
            </p>

            <button
                class="play-button"
                onclick="selectGame('coin')">

                SELECT

            </button>

        </div>



        <!-- 2. MINESWEEPER -->

        <div
            class="game-card"
            id="mineCard">

            <div class="game-icon">
                💣
            </div>

            <h3>
                MINESWEEPER
            </h3>

            <p>
                지뢰를 피해 모든 칸을 열어보세요.
                다양한 크기를 선택할 수 있습니다.
            </p>

            <button
                class="play-button"
                onclick="selectGame('mine')">

                SELECT

            </button>

        </div>



        <!-- 3. SPACE RUN -->

        <div class="game-card">

            <div class="game-icon">
                🚀
            </div>

            <h3>
                SPACE RUN
            </h3>

            <p>
                우주선을 조종하며
                장애물을 피해보세요.
            </p>

            <button
                class="play-button coming">

                COMING SOON

            </button>

        </div>



        <!-- 4. BATTLE -->

        <div class="game-card">

            <div class="game-icon">
                ⚔️
            </div>

            <h3>
                BATTLE
            </h3>

            <p>
                다양한 상대와
                전투를 펼쳐보세요.
            </p>

            <button
                class="play-button coming">

                COMING SOON

            </button>

        </div>



        <!-- 5. PUZZLE -->

        <div class="game-card">

            <div class="game-icon">
                🧩
            </div>

            <h3>
                PUZZLE
            </h3>

            <p>
                다양한 퍼즐을 풀어
                최고의 기록에 도전하세요.
            </p>

            <button
                class="play-button coming">

                COMING SOON

            </button>

        </div>



        <!-- 6. RACING -->

        <div class="game-card">

            <div class="game-icon">
                🏎️
            </div>

            <h3>
                RACING
            </h3>

            <p>
                빠르게 달리며
                최고의 기록을 만들어보세요.
            </p>

            <button
                class="play-button coming">

                COMING SOON

            </button>

        </div>


    </div>

</div>



<script>

/* 선택된 게임 */

let selectedGame = null;


/* =========================
   게임 선택
========================= */

function selectGame(game) {

    selectedGame = game;

    const heroIcon =
        document.getElementById("heroIcon");

    const heroTitle =
        document.getElementById("heroTitle");

    const heroDescription =
        document.getElementById("heroDescription");

    const startButton =
        document.getElementById("startButton");

    const coinCard =
        document.getElementById("coinCard");

    const mineCard =
        document.getElementById("mineCard");


    /* 선택 표시 초기화 */

    coinCard.classList.remove("selected");
    mineCard.classList.remove("selected");


    /* COIN FLIP */

    if (game === "coin") {

        heroIcon.textContent = "🪙";

        heroTitle.textContent =
            "COIN FLIP";

        heroDescription.textContent =
            "회전하는 동전을 보고 앞면인지 뒷면인지 맞혀보세요.";

        startButton.style.display =
            "block";

        coinCard.classList.add("selected");

    }


    /* MINESWEEPER */

    if (game === "mine") {

        heroIcon.textContent = "💣";

        heroTitle.textContent =
            "MINESWEEPER";

        heroDescription.textContent =
            "지뢰를 피해 모든 칸을 열어보세요.";

        startButton.style.display =
            "block";

        mineCard.classList.add("selected");

    }


    /* 메인 화면으로 이동 */

    document.getElementById("hero")
        .scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

}


/* =========================
   GAME START
========================= */

function startSelectedGame() {

    if (selectedGame === "coin") {

        location.href =
            "game.html";

    }

    if (selectedGame === "mine") {

        location.href =
            "minesweeper.html";

    }

}

</script>


</body>
</html>
