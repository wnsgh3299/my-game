<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GAME STUDIO</title>


<style>

/* =========================
   기본 설정
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    background: #070c18;

    color: white;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    min-height: 100vh;
}


/* =========================
   전체 컨테이너
========================= */

.container {

    width: 92%;

    max-width: 1400px;

    margin: 0 auto;

    padding: 45px 0 80px;

}


/* =========================
   메인 게임 영역
========================= */

.hero {

    width: 100%;

    min-height: 500px;

    background:
        linear-gradient(
            135deg,
            #101a2d,
            #172746
        );

    border:
        1px solid #263653;

    border-radius: 26px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 50px 20px;

    margin-bottom: 65px;

    transition:
        border-color 0.25s,
        box-shadow 0.25s;

}


/* 선택된 게임일 때 */

.hero.active {

    border-color: #2563eb;

    box-shadow:
        0 0 40px rgba(
            37,
            99,
            235,
            0.12
        );

}


/* =========================
   메인 아이콘
========================= */

.hero-icon {

    font-size: 100px;

    margin-bottom: 25px;

    animation:
        floating 3s ease-in-out infinite;

}


@keyframes floating {

    0% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-10px);

    }

    100% {

        transform:
            translateY(0);

    }

}


/* =========================
   메인 제목
========================= */

.hero-title {

    font-size: 52px;

    font-weight: 800;

    letter-spacing: 1px;

    margin-bottom: 15px;

}


/* =========================
   메인 설명
========================= */

.hero-description {

    color: #9db1d0;

    font-size: 18px;

    line-height: 1.6;

    margin-bottom: 32px;

    max-width: 650px;

}


/* =========================
   GAME START
========================= */

.start-button {

    display: none;

    border: none;

    background: #2563eb;

    color: white;

    padding:
        15px
        38px;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform 0.2s,
        background 0.2s;

}


.start-button:hover {

    background: #3b82f6;

    transform:
        translateY(-3px);

}


/* =========================
   GAMES 제목
========================= */

.games-title {

    font-size: 32px;

    font-weight: 800;

    margin-bottom: 28px;

}


/* =========================
   게임 6개
========================= */

.games {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;

}


/* =========================
   게임 카드
========================= */

.game-card {

    min-height: 300px;

    background: #111a2b;

    border:
        1px solid #263653;

    border-radius: 18px;

    padding:
        30px
        25px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    transition:
        transform 0.2s,
        border-color 0.2s,
        box-shadow 0.2s;

}


.game-card:hover {

    transform:
        translateY(-5px);

    border-color:
        #3b82f6;

}


/* 선택된 카드 */

.game-card.selected {

    border-color:
        #3b82f6;

    box-shadow:
        0 0 25px
        rgba(
            37,
            99,
            235,
            0.15
        );

}


/* =========================
   카드 아이콘
========================= */

.game-icon {

    font-size: 58px;

    margin-bottom: 20px;

}


/* =========================
   카드 제목
========================= */

.game-card h3 {

    font-size: 22px;

    margin-bottom: 13px;

}


/* =========================
   카드 설명
========================= */

.game-card p {

    color: #91a7c5;

    font-size: 14px;

    line-height: 1.55;

    min-height: 45px;

    margin-bottom: 23px;

}


/* =========================
   SELECT 버튼
========================= */

.select-button {

    border: none;

    background: #2563eb;

    color: white;

    padding:
        10px
        27px;

    border-radius: 8px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s,
        transform 0.2s;

}


.select-button:hover {

    background: #3b82f6;

    transform:
        translateY(-2px);

}


/* =========================
   COMING SOON
========================= */

.coming-button {

    background: #3b465a;

    cursor: default;

}


.coming-button:hover {

    background: #3b465a;

    transform: none;

}


/* =========================
   태블릿
========================= */

@media (max-width: 950px) {

    .games {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    .container {

        width: 94%;

        padding-top: 25px;

    }


    .hero {

        min-height: 430px;

        margin-bottom: 50px;

    }


    .hero-icon {

        font-size: 75px;

    }


    .hero-title {

        font-size: 36px;

    }


    .hero-description {

        font-size: 15px;

    }


    .games {

        grid-template-columns:
            1fr;

    }


    .games-title {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==================================================
     메인 게임
=================================================== -->

<section
    class="hero"
    id="hero">


    <!-- 아이콘 -->

    <div
        class="hero-icon"
        id="heroIcon">

        🎮

    </div>


    <!-- 제목 -->

    <h1
        class="hero-title"
        id="heroTitle">

        게임을 선택하세요

    </h1>


    <!-- 설명 -->

    <p
        class="hero-description"
        id="heroDescription">

        아래에서 플레이할 게임을 선택해주세요.

    </p>


    <!-- 시작 버튼 -->

    <button
        class="start-button"
        id="startButton"
        onclick="startGame()">

        GAME START

    </button>


</section>



<!-- ==================================================
     GAMES
=================================================== -->

<h2 class="games-title">

    🎮 GAMES

</h2>



<div class="games">



<!-- ==================================================
     1. COIN FLIP
=================================================== -->

<div
    class="game-card"
    id="coinCard">


    <div class="game-icon">

        🪙

    </div>


    <h3>

        COIN FLIP

    </h3>


    <p>

        회전하는 동전을 보고
        앞면인지 뒷면인지 맞혀보세요.

    </p>


    <button
        class="select-button"
        onclick="selectGame('coin')">

        SELECT

    </button>


</div>



<!-- ==================================================
     2. MINESWEEPER
=================================================== -->

<div
    class="game-card"
    id="mineCard">


    <div class="game-icon">

        💣

    </div>


    <h3>

        MINESWEEPER

    </h3>


    <p>

        지뢰를 피해 모든 칸을 열어보세요.
        다양한 게임판 크기를 선택할 수 있습니다.

    </p>


    <button
        class="select-button"
        onclick="selectGame('mine')">

        SELECT

    </button>


</div>



<!-- ==================================================
     3. SPACE RUN
=================================================== -->

<div class="game-card">


    <div class="game-icon">

        🚀

    </div>


    <h3>

        SPACE RUN

    </h3>


    <p>

        우주선을 조종하며
        장애물을 피해보세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>



<!-- ==================================================
     4. BATTLE
=================================================== -->

<div class="game-card">


    <div class="game-icon">

        ⚔️

    </div>


    <h3>

        BATTLE

    </h3>


    <p>

        다양한 상대와
        전투를 펼쳐보세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>



<!-- ==================================================
     5. PUZZLE
=================================================== -->

<div class="game-card">


    <div class="game-icon">

        🧩

    </div>


    <h3>

        PUZZLE

    </h3>


    <p>

        다양한 퍼즐을 풀어
        최고의 기록에 도전하세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>



<!-- ==================================================
     6. RACING
=================================================== -->

<div class="game-card">


    <div class="game-icon">

        🏎️

    </div>


    <h3>

        RACING

    </h3>


    <p>

        빠르게 달리며
        최고의 기록을 만들어보세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>


</div>

</div>



<script>


/* ==================================================
   선택된 게임
=================================================== */

let selectedGame = null;



/* ==================================================
   게임 선택
=================================================== */

function selectGame(game) {


    selectedGame = game;


    const hero =
        document.getElementById(
            "hero"
        );


    const icon =
        document.getElementById(
            "heroIcon"
        );


    const title =
        document.getElementById(
            "heroTitle"
        );


    const description =
        document.getElementById(
            "heroDescription"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const coinCard =
        document.getElementById(
            "coinCard"
        );


    const mineCard =
        document.getElementById(
            "mineCard"
        );


    /* 선택 표시 초기화 */

    coinCard.classList.remove(
        "selected"
    );

    mineCard.classList.remove(
        "selected"
    );


    /* =================================
       COIN FLIP
    ================================= */

    if (game === "coin") {


        icon.textContent =
            "🪙";


        title.textContent =
            "COIN FLIP";


        description.textContent =
            "회전하는 동전을 보고 앞면인지 뒷면인지 맞혀보세요.";


        startButton.style.display =
            "block";


        coinCard.classList.add(
            "selected"
        );


        hero.classList.add(
            "active"
        );

    }



    /* =================================
       MINESWEEPER
    ================================= */

    if (game === "mine") {


        icon.textContent =
            "💣";


        title.textContent =
            "MINESWEEPER";


        description.textContent =
            "지뢰를 피해 모든 칸을 열어보세요.";


        startButton.style.display =
            "block";


        mineCard.classList.add(
            "selected"
        );


        hero.classList.add(
            "active"
        );

    }



    /* 위쪽 메인 화면으로 이동 */

    hero.scrollIntoView({

        behavior: "smooth",

        block: "center"

    });

}



/* ==================================================
   GAME START
=================================================== */

function startGame() {


    if (
        selectedGame ===
        "coin"
    ) {

        location.href =
            "game.html";

        return;

    }


    if (
        selectedGame ===
        "mine"
    ) {

        location.href =
            "minesweeper.html";

        return;

    }

}

</script>


</body>

</html>
