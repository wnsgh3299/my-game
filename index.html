<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GAME STUDIO</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {

    background: #070c18;

    color: white;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    min-height: 100vh;

}


/* =========================
   CONTAINER
========================= */

.container {

    width: 92%;

    max-width: 1400px;

    margin: auto;

    padding: 45px 0 80px;

}


/* =========================
   HERO
========================= */

.hero {

    min-height: 500px;

    background:
        linear-gradient(
            135deg,
            #101a2d,
            #172746
        );

    border: 1px solid #263653;

    border-radius: 26px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 50px 25px;

    margin-bottom: 65px;

    transition: 0.3s;

}


.hero.selected {

    border-color: #2563eb;

    box-shadow:
        0 0 40px
        rgba(37,99,235,0.12);

}


/* =========================
   HERO ICON
========================= */

.hero-icon {

    font-size: 95px;

    margin-bottom: 25px;

}


/* =========================
   HERO TITLE
========================= */

.hero-title {

    font-size: 52px;

    font-weight: 800;

    margin-bottom: 15px;

}


/* =========================
   HERO DESCRIPTION
========================= */

.hero-description {

    color: #9db1d0;

    font-size: 18px;

    line-height: 1.6;

    max-width: 650px;

    margin-bottom: 30px;

}


/* =========================
   START BUTTON
========================= */

.start-button {

    display: none;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    padding: 15px 40px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.start-button:hover {

    background: #3b82f6;

    transform:
        translateY(-2px);

}


/* =========================
   GAMES TITLE
========================= */

.games-title {

    font-size: 32px;

    font-weight: 800;

    margin-bottom: 28px;

}


/* =========================
   GAMES GRID
========================= */

.games {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 22px;

}


/* =========================
   GAME CARD
========================= */

.game-card {

    min-height: 300px;

    background: #111a2b;

    border: 1px solid #263653;

    border-radius: 18px;

    padding: 30px 25px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    transition: 0.2s;

}


.game-card:hover {

    transform:
        translateY(-5px);

    border-color:
        #3b82f6;

}


/* 선택된 카드 */

.game-card.selected {

    border-color:
        #3b82f6;

    box-shadow:
        0 0 25px
        rgba(37,99,235,0.15);

}


/* =========================
   GAME ICON
========================= */

.game-icon {

    font-size: 58px;

    margin-bottom: 18px;

}


/* =========================
   GAME NAME
========================= */

.game-card h3 {

    font-size: 22px;

    margin-bottom: 12px;

}


/* =========================
   GAME DESCRIPTION
========================= */

.game-card p {

    color: #91a7c5;

    font-size: 14px;

    line-height: 1.5;

    min-height: 45px;

    margin-bottom: 22px;

}


/* =========================
   SELECT BUTTON
========================= */

.select-button {

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    padding: 10px 28px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;

}


.select-button:hover {

    background: #3b82f6;

    transform:
        translateY(-2px);

}


/* =========================
   COMING SOON
========================= */

.coming-button {

    background: #3b465a;

    cursor: default;

}


.coming-button:hover {

    background: #3b465a;

    transform: none;

}


/* =========================
   TABLET
========================= */

@media (max-width: 950px) {

    .games {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {

        width: 94%;

        padding-top: 25px;

    }


    .hero {

        min-height: 430px;

        margin-bottom: 50px;

    }


    .hero-icon {

        font-size: 75px;

    }


    .hero-title {

        font-size: 36px;

    }


    .hero-description {

        font-size: 15px;

    }


    .games {

        grid-template-columns: 1fr;

    }


    .games-title {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HERO
========================= -->

<section
    class="hero"
    id="hero">


    <div
        class="hero-icon"
        id="heroIcon">

        🎮

    </div>


    <h1
        class="hero-title"
        id="heroTitle">

        게임을 선택하세요

    </h1>


    <p
        class="hero-description"
        id="heroDescription">

        아래에서 플레이할 게임을 선택해주세요.

    </p>


    <button
        class="start-button"
        id="startButton"
        onclick="startSelectedGame()">

        GAME START

    </button>


</section>



<!-- =========================
     GAMES
========================= -->

<h2 class="games-title">

    🎮 GAMES

</h2>



<div class="games">


<!-- =========================
     COIN FLIP
========================= -->

<div
    class="game-card"
    id="coinCard">


    <div class="game-icon">

        🪙

    </div>


    <h3>

        COIN FLIP

    </h3>


    <p>

        회전하는 동전을 보고
        앞면인지 뒷면인지 맞혀보세요.

    </p>


    <button
        class="select-button"
        onclick="selectGame('coin')">

        SELECT

    </button>


</div>



<!-- =========================
     MINESWEEPER
========================= -->

<div
    class="game-card"
    id="mineCard">


    <div class="game-icon">

        💣

    </div>


    <h3>

        MINESWEEPER

    </h3>


    <p>

        지뢰를 피해 모든 칸을
        안전하게 열어보세요.

    </p>


    <button
        class="select-button"
        onclick="selectGame('mine')">

        SELECT

    </button>


</div>



<!-- =========================
     SNAKE
========================= -->

<div
    class="game-card"
    id="snakeCard">


    <div class="game-icon">

        🐍

    </div>


    <h3>

        SNAKE

    </h3>


    <p>

        먹이를 먹으며
        최대한 길게 성장하세요.

    </p>


    <button
        class="select-button"
        onclick="selectGame('snake')">

        SELECT

    </button>


</div>



<!-- =========================
     SPACE RUN
========================= -->

<div class="game-card">


    <div class="game-icon">

        🚀

    </div>


    <h3>

        SPACE RUN

    </h3>


    <p>

        우주선을 조종하며
        장애물을 피해보세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>



<!-- =========================
     PUZZLE
========================= -->

<div class="game-card">


    <div class="game-icon">

        🧩

    </div>


    <h3>

        PUZZLE

    </h3>


    <p>

        다양한 퍼즐을 풀어
        최고의 기록에 도전하세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>



<!-- =========================
     RACING
========================= -->

<div class="game-card">


    <div class="game-icon">

        🏎️

    </div>


    <h3>

        RACING

    </h3>


    <p>

        빠르게 달리며
        최고의 기록을 만들어보세요.

    </p>


    <button
        class="select-button coming-button">

        COMING SOON

    </button>


</div>


</div>

</div>



<script>

/* =========================
   현재 선택된 게임
========================= */

let selectedGame = null;


/* =========================
   게임 선택
========================= */

function selectGame(game) {

    selectedGame = game;


    const hero =
        document.getElementById("hero");

    const icon =
        document.getElementById("heroIcon");

    const title =
        document.getElementById("heroTitle");

    const description =
        document.getElementById("heroDescription");

    const startButton =
        document.getElementById("startButton");


    /* 모든 카드 선택 해제 */

    document
        .querySelectorAll(".game-card")
        .forEach(card => {

            card.classList.remove("selected");

        });


    /* =========================
       COIN FLIP
    ========================= */

    if (game === "coin") {

        icon.textContent = "🪙";

        title.textContent = "COIN FLIP";

        description.textContent =
            "회전하는 동전을 보고 앞면인지 뒷면인지 맞혀보세요.";

        startButton.style.display =
            "block";

        document
            .getElementById("coinCard")
            .classList.add("selected");

    }


    /* =========================
       MINESWEEPER
    ========================= */

    if (game === "mine") {

        icon.textContent = "💣";

        title.textContent = "MINESWEEPER";

        description.textContent =
            "지뢰를 피해 모든 칸을 안전하게 열어보세요.";

        startButton.style.display =
            "block";

        document
            .getElementById("mineCard")
            .classList.add("selected");

    }


    /* =========================
       SNAKE
    ========================= */

    if (game === "snake") {

        icon.textContent = "🐍";

        title.textContent = "SNAKE";

        description.textContent =
            "먹이를 먹으며 최대한 길게 성장하세요.";

        startButton.style.display =
            "block";

        document
            .getElementById("snakeCard")
            .classList.add("selected");

    }


    hero.classList.add("selected");


    /* 위쪽으로 이동 */

    hero.scrollIntoView({

        behavior: "smooth",

        block: "center"

    });

}


/* =========================
   GAME START
========================= */

function startSelectedGame() {

    if (selectedGame === "coin") {

        window.location.href =
            "game.html";

    }


    if (selectedGame === "mine") {

        window.location.href =
            "minesweeper.html";

    }


    if (selectedGame === "snake") {

        window.location.href =
            "snake.html";

    }

}

</script>


</body>

</html>
