<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COIN FLIP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #070c18;
    color: white;
    font-family: Arial, "Noto Sans KR", sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 700px;
    text-align: center;
}

h1 {
    font-size: 44px;
    margin-bottom: 12px;
}

.description {
    color: #91a7c5;
    font-size: 16px;
    margin-bottom: 45px;
}

/* 동전 */
.coin {
    width: 180px;
    height: 180px;

    margin: 0 auto 45px;

    border-radius: 50%;

    background: #d9a441;

    border: 8px solid #f1c75b;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 75px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.4);
}

/* 회전 */
.coin.spin {
    animation: spin 2.5s ease-in-out;
}

@keyframes spin {
    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(1800deg);
    }
}

/* 버튼 */
button {
    border: none;

    border-radius: 10px;

    padding: 14px 30px;

    margin: 6px;

    color: white;

    background: #2563eb;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #3b82f6;
    transform: translateY(-2px);
}

/* 선택 버튼 */
.choice-buttons {
    display: none;
    margin-top: 10px;
}

/* 결과 */
.result {
    min-height: 45px;

    margin-top: 25px;

    font-size: 25px;

    font-weight: bold;
}

/* 다시하기 */
.restart {
    display: none;

    background: #475569;
}

.restart:hover {
    background: #64748b;
}

/* 메인으로 */
.home {
    display: block;

    margin: 30px auto 0;

    background: #1e293b;
}

.home:hover {
    background: #334155;
}
</style>
</head>

<body>

<div class="container">

    <h1>🪙 COIN FLIP</h1>

    <p class="description">
        동전이 멈추기 전에 앞면인지 뒷면인지 맞혀보세요!
    </p>

    <!-- 동전 -->
    <div class="coin" id="coin">
        🪙
    </div>

    <!-- 게임 시작 -->
    <button id="startButton" onclick="startGame()">
        게임 시작
    </button>

    <!-- 앞면 / 뒷면 -->
    <div class="choice-buttons" id="choiceButtons">

        <button onclick="choose('앞면')">
            앞면
        </button>

        <button onclick="choose('뒷면')">
            뒷면
        </button>

    </div>

    <!-- 결과 -->
    <div class="result" id="result"></div>

    <!-- 다시하기 -->
    <button
        class="restart"
        id="restartButton"
        onclick="restartGame()">

        다시하기

    </button>

    <!-- 메인으로 -->
    <button
        class="home"
        onclick="location.href='index.html'">

        🏠 메인으로

    </button>

</div>


<script>

let answer = "";
let gameStarted = false;


/* =========================
   게임 시작
========================= */

function startGame() {

    if (gameStarted) {
        return;
    }

    gameStarted = true;

    const coin =
        document.getElementById("coin");

    const startButton =
        document.getElementById("startButton");

    const choices =
        document.getElementById("choiceButtons");

    const result =
        document.getElementById("result");

    const restart =
        document.getElementById("restartButton");


    /* 화면 초기화 */

    result.textContent = "";

    choices.style.display = "none";

    restart.style.display = "none";

    startButton.style.display = "none";


    /* 실제 결과 랜덤 결정 */

    answer =
        Math.random() < 0.5
        ? "앞면"
        : "뒷면";


    /* 회전 초기화 */

    coin.classList.remove("spin");

    void coin.offsetWidth;


    /* 동전 회전 */

    coin.classList.add("spin");


    /* 2.5초 후 선택 */

    setTimeout(function() {

        choices.style.display = "block";

    }, 2500);

}


/* =========================
   앞면 / 뒷면 선택
========================= */

function choose(choice) {

    const choices =
        document.getElementById("choiceButtons");

    const result =
        document.getElementById("result");

    const restart =
        document.getElementById("restartButton");


    /* 선택 버튼 숨기기 */

    choices.style.display = "none";


    /* 결과 */

    if (choice === answer) {

        result.textContent = "🎉 정답!";

    } else {

        result.textContent = "❌ 실패!";

    }


    /* 다시하기 표시 */

    restart.style.display = "inline-block";

}


/* =========================
   다시하기
========================= */

function restartGame() {

    const coin =
        document.getElementById("coin");

    const startButton =
        document.getElementById("startButton");

    const choices =
        document.getElementById("choiceButtons");

    const result =
        document.getElementById("result");

    const restart =
        document.getElementById("restartButton");


    /* 게임 상태 초기화 */

    answer = "";

    gameStarted = false;


    /* 동전 애니메이션 초기화 */

    coin.classList.remove("spin");


    /* 결과 초기화 */

    result.textContent = "";


    /* 버튼 초기화 */

    choices.style.display = "none";

    restart.style.display = "none";

    startButton.style.display = "inline-block";

}

</script>

</body>
</html>
