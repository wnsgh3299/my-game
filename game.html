<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COIN FLIP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #070c18;
    color: white;
    font-family: Arial, "Noto Sans KR", sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 92%;
    max-width: 650px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.description {
    color: #91a7c5;
    margin-bottom: 40px;
}

.coin {
    width: 180px;
    height: 180px;
    margin: 0 auto 40px;

    border-radius: 50%;

    background: #d9a441;
    border: 8px solid #f1c75b;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 75px;
}

.spin {
    animation: spin 2.5s ease-in-out;
}

@keyframes spin {
    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(1800deg);
    }
}

button {
    border: none;
    border-radius: 10px;

    padding: 14px 30px;
    margin: 6px;

    color: white;
    background: #2563eb;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #3b82f6;
}

/* 앞면 / 뒷면 */
#choices {
    display: none;
}

/* 결과 */
#result {
    min-height: 45px;
    margin-top: 20px;

    font-size: 26px;
    font-weight: bold;
}

/* 다시하기 */
#restart {
    display: none;
    background: #475569;
}

/* =========================
   메인으로 버튼
========================= */

.main-button {
    display: block;

    margin: 35px auto 0;

    background: #1e293b;

    border: 1px solid #334155;

    padding: 13px 28px;
}

.main-button:hover {
    background: #334155;
}
</style>
</head>


<body>

<div class="container">

    <h1>🪙 COIN FLIP</h1>

    <p class="description">
        동전이 멈추기 전에 앞면인지 뒷면인지 맞혀보세요!
    </p>


    <!-- 동전 -->

    <div
        class="coin"
        id="coin">

        🪙

    </div>


    <!-- 게임 시작 -->

    <button
        id="startButton"
        onclick="startGame()">

        게임 시작

    </button>


    <!-- 선택 -->

    <div id="choices">

        <button onclick="choose('앞면')">
            앞면
        </button>

        <button onclick="choose('뒷면')">
            뒷면
        </button>

    </div>


    <!-- 결과 -->

    <div id="result"></div>


    <!-- 다시하기 -->

    <button
        id="restart"
        onclick="restartGame()">

        🔄 다시하기

    </button>


    <!-- ⭐ 메인으로 -->

    <button
        class="main-button"
        onclick="goHome()">

        🏠 메인으로

    </button>

</div>


<script>

let answer = "";
let playing = false;


/* =========================
   게임 시작
========================= */

function startGame() {

    if (playing) {
        return;
    }

    playing = true;

    const coin =
        document.getElementById("coin");

    const startButton =
        document.getElementById("startButton");

    const choices =
        document.getElementById("choices");

    const result =
        document.getElementById("result");

    const restart =
        document.getElementById("restart");


    startButton.style.display = "none";

    choices.style.display = "none";

    restart.style.display = "none";

    result.textContent = "";


    /* 랜덤 결과 */

    answer =
        Math.random() < 0.5
        ? "앞면"
        : "뒷면";


    /* 동전 회전 */

    coin.classList.remove("spin");

    void coin.offsetWidth;

    coin.classList.add("spin");


    /* 2.5초 후 선택 */

    setTimeout(function() {

        choices.style.display = "block";

    }, 2500);

}


/* =========================
   선택
========================= */

function choose(choice) {

    if (!playing) {
        return;
    }

    const choices =
        document.getElementById("choices");

    const result =
        document.getElementById("result");

    const restart =
        document.getElementById("restart");


    choices.style.display = "none";


    if (choice === answer) {

        result.textContent = "🎉 정답!";

    } else {

        result.textContent = "❌ 실패!";

    }


    restart.style.display = "inline-block";

}


/* =========================
   다시하기
========================= */

function restartGame() {

    const coin =
        document.getElementById("coin");

    const startButton =
        document.getElementById("startButton");

    const choices =
        document.getElementById("choices");

    const result =
        document.getElementById("result");

    const restart =
        document.getElementById("restart");


    playing = false;

    answer = "";


    coin.classList.remove("spin");

    choices.style.display = "none";

    result.textContent = "";

    restart.style.display = "none";

    startButton.style.display = "inline-block";

}


/* =========================
   ⭐ 메인으로
========================= */

function goHome() {

    window.location.href = "index.html";

}

</script>

</body>
</html>
