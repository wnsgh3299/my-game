<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Coin Flip</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    background: #070c18;

    color: white;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

}


.container {

    width: 92%;

    max-width: 700px;

    text-align: center;

}


h1 {

    font-size: 42px;

    margin-bottom: 10px;

}


.description {

    color: #91a7c5;

    margin-bottom: 45px;

}


/* 동전 */

.coin {

    width: 180px;

    height: 180px;

    margin: 0 auto 45px;

    border-radius: 50%;

    background: #d9a441;

    border: 8px solid #f1c75b;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 75px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.35);

}


/* 회전 */

.coin.spin {

    animation:
        spin 2.5s ease-in-out;

}


@keyframes spin {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(1800deg);
    }

}


/* 버튼 */

button {

    border: none;

    border-radius: 10px;

    padding: 14px 30px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    color: white;

    background: #2563eb;

    margin: 6px;

}


button:hover {

    background: #3b82f6;

    transform: translateY(-2px);

}


.choice-buttons {

    display: none;

    margin-top: 20px;

}


.result {

    min-height: 40px;

    margin-top: 25px;

    font-size: 24px;

    font-weight: bold;

}


.restart {

    display: none;

    background: #475569;

}


.restart:hover {

    background: #64748b;

}


.home {

    margin-top: 30px;

    background: #1e293b;

}


</style>

</head>


<body>


<div class="container">


<h1>🪙 COIN FLIP</h1>


<p class="description">

동전이 멈추기 전에 결과를 예측해보세요!

</p>


<div
    class="coin"
    id="coin">

    🪙

</div>


<!-- 시작 -->

<button
    id="startButton"
    onclick="startGame()">

    게임 시작

</button>


<!-- 선택 -->

<div
    class="choice-buttons"
    id="choiceButtons">


    <button
        onclick="choose('앞면')">

        앞면

    </button>


    <button
        onclick="choose('뒷면')">

        뒷면

    </button>


</div>


<!-- 결과 -->

<div
    class="result"
    id="result">

</div>


<!-- 다시하기 -->

<button
    class="restart"
    id="restartButton"
    onclick="restartGame()">

    다시하기

</button>


<br>


<!-- 메인 -->

<button
    class="home"
    onclick="location.href='index.html'">

    🏠 메인으로

</button>


</div>



<script>


let answer = "";

let gameStarted = false;


/* =========================
   게임 시작
========================= */

function startGame() {


    if (gameStarted) return;


    gameStarted = true;


    const coin =
        document.getElementById(
            "coin"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const choices =
        document.getElementById(
            "choiceButtons"
        );


    const result =
        document.getElementById(
            "result"
        );


    const restart =
        document.getElementById(
            "restartButton"
        );


    /* 초기화 */

    result.textContent = "";

    choices.style.display =
        "none";

    restart.style.display =
        "none";

    startButton.style.display =
        "none";


    /* 실제 정답 결정 */

    answer =
        Math.random() < 0.5
        ? "앞면"
        : "뒷면";


    /* 회전 */

    coin.classList.remove(
        "spin"
    );


    void coin.offsetWidth;


    coin.classList.add(
        "spin"
    );


    /* 2.5초 후 선택 버튼 */

    setTimeout(function() {


        choices.style.display =
            "block";


    }, 2500);

}



/* =========================
   정답 선택
========================= */

function choose(choice) {


    const choices =
        document.getElementById(
            "choiceButtons"
        );


    const result =
        document.getElementById(
            "result"
        );


    const restart =
        document.getElementById(
            "restartButton"
        );


    choices.style.display =
        "none";


    if (choice === answer) {

        result.textContent =
            "🎉 정답!";

    } else {

        result.textContent =
            "❌ 실패!";

    }


    restart.style.display =
        "inline-block";

}



/* =========================
   다시하기
========================= */

function restartGame() {


    const coin =
        document.getElementById(
            "coin"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const choices =
        document.getElementById(
            "choiceButtons"
        );


    const result =
        document.getElementById(
            "result"
        );


    const restart =
        document.getElementById(
            "restartButton"
        );


    /* 상태 초기화 */

    answer = "";

    gameStarted = false;


    /* 동전 애니메이션 제거 */

    coin.classList.remove(
        "spin"
    );


    /* 화면 초기화 */

    result.textContent =
        "";


    choices.style.display =
        "none";


    restart.style.display =
        "none";


    startButton.style.display =
        "inline-block";

}


</script>


</body>

</html>
